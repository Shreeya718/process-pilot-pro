# Process Pilot Pro - example configuration.
# Run from the repository root after building:  ./build/process-pilot start config/example.conf
# Startup order is derived from `dependencies`: Logger -> Database -> WebApp

[Logger]
executable       = build/demo-service
args             = run Logger 1000
restart_policy   = always
max_restarts     = 5
restart_delay_ms = 1000
restart_window_s = 60

[Database]
executable       = build/demo-service
args             = run Database 1500
dependencies     = Logger
restart_policy   = on_failure
max_restarts     = 5
restart_delay_ms = 1000
health_interval_ms = 2000
max_rss_kb       = 524288

[WebApp]
executable       = build/demo-service
args             = run WebApp 2000
dependencies     = Database
restart_policy   = on_failure
max_restarts     = 5
restart_delay_ms = 1000
stop_timeout_ms  = 5000
