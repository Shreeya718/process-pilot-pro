# Self-healing demo: "Flaky" crashes every 2 s. The supervisor restarts it twice,
# then declares it PERMANENTLY_FAILED (crash-loop protection) while the rest keeps running.
# Run from the repository root:  ./build/process-pilot start config/test.conf

[Logger]
executable = build/demo-service
args       = run Logger 1000

[Database]
executable   = build/demo-service
args         = run Database 1000
dependencies = Logger

[WebApp]
executable   = build/demo-service
args         = run WebApp 1000
dependencies = Database

[Flaky]
executable       = build/demo-service
args             = crash 2000 1
dependencies     = WebApp
restart_policy   = on_failure
max_restarts     = 2
restart_delay_ms = 500
restart_window_s = 60

[Disabled]
executable = build/demo-service
args       = run Disabled 1000
enabled    = false
